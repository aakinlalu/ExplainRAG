[project]
name = "rag-learning-backend"
version = "1.0.0"
description = "Interactive RAG Learning Platform Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-core>=0.3.0",
    "pypdf>=3.17.4",
    "python-docx>=1.1.0",
    "lancedb>=0.4.4",
    "pyarrow>=14.0.2",
    "openai>=1.8.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "tiktoken>=0.5.2",
    "numpy>=1.26.0",
    "pandas>=2.3.3",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]
