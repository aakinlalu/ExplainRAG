<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="5" y="5" width="90" height="90" rx="15" ry="15" fill="url(#grad)"/>
  <!-- RAG letters stylized -->
  <text x="50" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white" text-anchor="middle">
    RAG
  </text>
  <!-- Search/retrieval icon indicator -->
  <circle cx="75" cy="25" r="10" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
  <line x1="82" y1="32" x2="88" y2="38" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
